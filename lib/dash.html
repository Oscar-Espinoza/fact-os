<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dash/base.css">
<link rel="stylesheet" href="/dash/factory.css">
<link rel="stylesheet" href="/dash/board.css">
<link rel="stylesheet" href="/dash/you.css">
<link rel="stylesheet" href="/dash/observer.css">
<link rel="stylesheet" href="/dash/detail.css">
</head>
<body data-name="{{NAME}}">
<header class="top">
  <div class="brand"><img src="/assets/logo.png" alt="" width="42" height="40"><span><b>{{NAME}}</b><small>SOFTWARE FACTORY</small></span></div>
  <nav class="tabs" aria-label="Views">
    <a href="#factory" data-v="factory">Factory</a>
    <a href="#board" data-v="board">Board</a>
    <a href="#observer" data-v="observer">Observer</a>
    <a href="#project" data-v="project">Project</a>
    <a href="#you" data-v="you">Only you <span class="badge" id="you-n"></span></a>
  </nav>
  <div class="spacer"></div>
  <div class="picker">
    <button class="btn" id="pick" aria-haspopup="listbox" aria-expanded="false"><span class="ell" id="pick-name">—</span><span aria-hidden="true">▾</span></button>
    <div class="menu" id="menu" role="listbox"></div>
  </div>
  <div class="status" id="foreman"><span class="dot"></span><span><b id="foreman-t">Foreman stopped</b><small id="foreman-s"></small></span></div>
  <div class="ctl" id="ctl" hidden>
    <button class="btn mode" id="mode" type="button"><span class="mode-k">Mode: </span><span id="mode-t">Opus</span></button>
    <div class="lanes" id="lanes-g" role="group" aria-label="Lanes: how many features may be in flight">
      <button class="ib" id="lanes-dn" type="button" aria-label="Fewer lanes" title="Fewer lanes"><span aria-hidden="true">−</span></button>
      <span class="lanes-t" id="lanes-t"></span>
      <button class="ib" id="lanes-up" type="button" aria-label="More lanes" title="More lanes"><span aria-hidden="true">+</span></button>
    </div>
    <button class="btn pz" id="pz" type="button"><span class="ic" id="pz-ic" aria-hidden="true"></span><span class="lbl" id="pz-t">Pause new work</span></button>
  </div>
</header>

<main>
  <section class="view" id="v-factory"><div id="factory"></div></section>
  <section class="view" id="v-board"><div id="board"></div></section>
  <section class="view" id="v-observer"><div id="observer"></div></section>
  <section class="view" id="v-project"><div id="project"></div></section>
  <section class="view" id="v-you"><div id="you"></div></section>
  <section class="view" id="v-detail"><div id="detail"></div></section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="/dash/core.js"></script>
<script src="/dash/factory.js"></script>
<script src="/dash/board.js"></script>
<script src="/dash/you.js"></script>
<script src="/dash/observer.js"></script>
<script src="/dash/detail.js"></script>
<script>F.boot();</script>
</body>
</html>
